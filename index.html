  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Redes Sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Sua Marca" />
    <meta property="og:title" content="Sua Marca | Atendimento Especializado" />
    <meta
      property="og:description"
      content="Atendimento profissional personalizado com foco em clareza, organização e acompanhamento próximo."
    />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sua Marca | Atendimento Especializado" />
    <meta
      name="twitter:description"
      content="Atendimento profissional personalizado com foco em clareza, organização e acompanhamento próximo."
    />

    <!-- Schema.org -->
    <script type="application/ld+json" id="schema-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Sua Marca",
        "description": "Atendimento profissional personalizado com foco em clareza e acompanhamento próximo."
      }
    </script>

    <!-- Favicon SVG embutido -->
    <link
      rel="icon"
      type="image/svg+xml"
      id="site-favicon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E5A6F'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%23FFFFFF' stroke-width='4'/%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Tipografia sans-serif forte e contemporânea -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =====================================================================
         VARIÁVEIS DE DESIGN (Editáveis via CONFIG.tema)
         ===================================================================== */
      :root {
        --bg-primary: #f6fafb;
        --bg-surface: #ebf4f6;
        --bg-card: #ffffff;
        --accent: #0e5a6f;
        --accent-hover: #0a4555;
        --accent-ink: #ffffff;
        --accent-soft: rgba(14, 90, 111, 0.1);
        --text-primary: #121c24;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-subtle: rgba(15, 23, 42, 0.09);
        --border-strong: rgba(15, 23, 42, 0.18);
        --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
        --shadow-md: 0 14px 36px rgba(15, 23, 42, 0.09);
        --input-bg: #ffffff;
        --error-bg: rgba(200, 45, 45, 0.09);
        --error-border: rgba(200, 45, 45, 0.35);
        --error-text: #9b1c1c;
        --font-display: 'Sora', 'Plus Jakarta Sans', sans-serif;
        --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        --container-max: 1200px;
        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 24px;
      }

      /* =====================================================================
         RESET & BASE
         ===================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      button {
        background: none;
        border: none;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .container {
        width: 100%;
        max-width: var(--container-max);
        margin-inline: auto;
        padding-inline: 1.25rem;
      }

      @media (min-width: 768px) {
        .container {
          padding-inline: 2.25rem;
        }
      }

      .section {
        padding-block: 4.75rem;
      }

      @media (min-width: 1024px) {
        .section {
          padding-block: 6.25rem;
        }
      }

      .section-surface {
        background-color: var(--bg-surface);
        border-top: 1px solid var(--border-subtle);
        border-bottom: 1px solid var(--border-subtle);
      }

      .kicker {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 0.75rem;
        letter-spacing: 0.01em;
      }

      .display-heading {
        font-family: var(--font-display);
        font-weight: 700;
        line-height: 1.24;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        text-wrap: balance;
        overflow: visible;
      }

      .section-title {
        font-size: clamp(1.875rem, 3.1vw, 2.65rem);
        max-width: 28ch;
        overflow: visible;
      }

      .section-header {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
        margin-bottom: 2.75rem;
        overflow: visible;
      }

      .section-header > div {
        min-width: 0;
        overflow: visible;
      }

      @media (min-width: 900px) {
        .section-header-split {
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;
          gap: 2.5rem;
        }

        .section-header-split > div {
          flex: 1 1 55%;
        }

        .section-header-split .section-lead {
          flex: 0 1 42%;
        }
      }

      .section-lead {
        color: var(--text-secondary);
        font-size: 1.03125rem;
        max-width: 52ch;
        line-height: 1.65;
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      /* Botões grandes e chamativos */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        min-height: 50px;
        padding: 0.875rem 1.75rem;
        border-radius: var(--radius-sm);
        font-size: 0.9375rem;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 180ms var(--ease-out-expo),
          border-color 180ms var(--ease-out-expo),
          color 180ms var(--ease-out-expo),
          transform 180ms var(--ease-out-expo),
          box-shadow 180ms var(--ease-out-expo);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-primary {
        background-color: var(--accent);
        color: var(--accent-ink);
        border: 1px solid var(--accent);
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .btn-outline {
        background-color: transparent;
        color: var(--text-primary);
        border: 1.5px solid var(--border-strong);
      }

      .btn-outline:hover {
        border-color: var(--accent);
        color: var(--accent);
        background-color: var(--accent-soft);
      }

      .btn-sm {
        min-height: 44px;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
      }

      /* =====================================================================
         PLACEHOLDERS ELEGANTES (Substituem todas as imagens)
         ===================================================================== */
      .media-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        background: linear-gradient(
          145deg,
          color-mix(in srgb, var(--accent) 6%, var(--bg-card)) 0%,
          color-mix(in srgb, var(--accent) 16%, var(--bg-surface)) 100%
        );
        border: 1.5px dashed color-mix(in srgb, var(--accent) 34%, transparent);
        border-radius: inherit;
        transition: border-color 220ms var(--ease-out-expo),
          background 220ms var(--ease-out-expo),
          transform 320ms var(--ease-out-expo);
      }

      .media-placeholder-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background-color: color-mix(in srgb, var(--accent) 11%, var(--bg-card));
        border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .media-placeholder-label {
        font-family: var(--font-display);
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: -0.01em;
      }

      /* =====================================================================
         1. HEADER FIXO (3 Zonas Limpas)
         ===================================================================== */
      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        height: 72px;
        display: flex;
        align-items: center;
        background-color: color-mix(in srgb, var(--bg-primary) 88%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid transparent;
        transition: border-color 200ms ease, box-shadow 200ms ease;
      }

      .site-header.is-scrolled {
        border-bottom-color: var(--border-subtle);
        box-shadow: var(--shadow-sm);
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
      }

      .brand-wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .brand-monogram {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        color: var(--accent);
      }

      .nav-links {
        display: none;
        align-items: center;
        gap: 1.75rem;
      }

      @media (min-width: 980px) {
        .nav-links {
          display: flex;
        }
      }

      .nav-link {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
        white-space: nowrap;
        flex-shrink: 0;
        position: relative;
        padding-block: 0.25rem;
        transition: color 160ms ease;
      }

      .nav-link::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        border-radius: 2px;
        background-color: var(--accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 200ms var(--ease-out-expo);
      }

      .nav-link:hover {
        color: var(--text-primary);
      }

      .nav-link:hover::after {
        transform: scaleX(1);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .header-cta {
        display: none;
      }

      @media (min-width: 640px) {
        .header-cta {
          display: inline-flex;
          min-height: 42px;
          padding: 0.55rem 1.15rem;
          font-size: 0.875rem;
        }
      }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        color: var(--text-primary);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
      }

      @media (min-width: 980px) {
        .menu-toggle {
          display: none;
        }
      }

      /* Drawer Mobile */
      .mobile-nav {
        position: fixed;
        inset: 72px 0 0 0;
        z-index: 49;
        background-color: var(--bg-primary);
        padding: 1.75rem 1.25rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
        transition: opacity 200ms var(--ease-out-expo),
          transform 200ms var(--ease-out-expo);
      }

      .mobile-nav.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .mobile-nav-list {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        list-style: none;
      }

      .mobile-nav-link {
        display: block;
        padding-block: 0.875rem;
        font-family: var(--font-display);
        font-size: 1.375rem;
        font-weight: 600;
        border-bottom: 1px solid var(--border-subtle);
        color: var(--text-primary);
      }

      /* =====================================================================
         2. HERO EM DUAS COLUNAS
         ===================================================================== */
      .hero {
        padding-top: 7rem;
        padding-bottom: 4rem;
      }

      @media (min-width: 1024px) {
        .hero {
          padding-top: 8.25rem;
          padding-bottom: 5rem;
        }
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        align-items: center;
      }

      @media (min-width: 960px) {
        .hero-grid {
          grid-template-columns: 1.05fr 0.95fr;
          gap: 4rem;
        }
      }

      .hero-title {
        font-size: clamp(2.25rem, 4vw, 3.5rem);
        line-height: 1.15;
        margin-bottom: 1.25rem;
        max-width: 18ch;
      }

      .hero-subtitle {
        font-size: clamp(1rem, 1.25vw, 1.125rem);
        color: var(--text-secondary);
        max-width: 50ch;
        line-height: 1.65;
        margin-bottom: 2rem;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.875rem;
      }

      .hero-media-card {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }

      @media (min-width: 960px) {
        .hero-media-card {
          aspect-ratio: 4 / 3.6;
        }
      }

      /* =====================================================================
         3. NÚMEROS DE CREDIBILIDADE (Faixa única de cards, sem duplicação)
         ===================================================================== */
      .metrics-band {
        background-color: var(--bg-surface);
        border-top: 1px solid var(--border-subtle);
        border-bottom: 1px solid var(--border-subtle);
        padding-block: 3.5rem;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      @media (min-width: 768px) {
        .metrics-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 2rem;
        }
      }

      .metric-item {
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        padding: 1.75rem 2rem;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
      }

      .metric-value {
        font-family: var(--font-display);
        font-size: clamp(2.25rem, 3.6vw, 3rem);
        font-weight: 700;
        line-height: 1.1;
        color: var(--accent);
      }

      .metric-label {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-top: 0.25rem;
      }

      .metric-context {
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      /* =====================================================================
         4. SERVIÇOS EM 3 OU 6 CARDS (Nunca deixa card solitário)
         ===================================================================== */
      .services-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }

      @media (min-width: 760px) {
        .services-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .service-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 220ms var(--ease-out-expo),
          box-shadow 220ms var(--ease-out-expo),
          border-color 220ms var(--ease-out-expo);
      }

      .service-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
        border-color: var(--border-strong);
      }

      .service-media {
        position: relative;
        aspect-ratio: 4 / 3;
        padding: 0.875rem 0.875rem 0;
        border-radius: calc(var(--radius-md) - 4px);
      }

      .service-card:hover .service-media .media-placeholder {
        border-color: color-mix(in srgb, var(--accent) 52%, transparent);
      }

      .service-body {
        padding: 1.375rem 1.5rem 1.5rem;
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 0.65rem;
      }

      .service-category {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--accent);
      }

      .service-title {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.28;
        color: var(--text-primary);
      }

      .service-desc {
        font-size: 0.9375rem;
        color: var(--text-secondary);
        line-height: 1.62;
      }

      .service-footer {
        margin-top: auto;
        padding-top: 1.125rem;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.875rem;
      }

      .service-price {
        font-family: var(--font-display);
        font-size: 1.1875rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      /* =====================================================================
         5. ANTES E DEPOIS COM SLIDER INTERATIVO
         ===================================================================== */
      .ba-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        align-items: center;
      }

      @media (min-width: 960px) {
        .ba-layout {
          grid-template-columns: 1.15fr 0.85fr;
          gap: 4rem;
        }
      }

      .ba-stage {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: var(--radius-lg);
        overflow: hidden;
        background-color: var(--bg-card);
        box-shadow: var(--shadow-md);
        user-select: none;
        touch-action: pan-y;
      }

      .ba-layer {
        position: absolute;
        inset: 0;
        border-radius: var(--radius-lg);
      }

      .ba-placeholder {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: var(--radius-lg);
        border: 1.5px dashed color-mix(in srgb, var(--accent) 34%, transparent);
      }

      .ba-placeholder-before {
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 4%, #eef3f5) 0%,
          color-mix(in srgb, var(--accent) 10%, #dce7eb) 100%
        );
      }

      .ba-placeholder-after {
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--accent) 11%, #ffffff) 0%,
          color-mix(in srgb, var(--accent) 23%, #dff0f4) 100%
        );
      }

      .ba-slot-badge {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        text-align: center;
        pointer-events: none;
        padding: 0.75rem;
        width: 44%;
      }

      .ba-slot-before {
        left: 25%;
      }

      .ba-slot-after {
        left: 75%;
      }

      .ba-layer-after {
        clip-path: inset(0 0 0 50%);
      }

      .ba-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        background-color: var(--accent);
        box-shadow: 0 0 12px rgba(14, 90, 111, 0.28);
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 3;
      }

      .ba-handle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        background-color: var(--accent);
        color: var(--accent-ink);
        border: 2px solid #ffffff;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .ba-range {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: ew-resize;
        z-index: 4;
      }

      .ba-stage:has(.ba-range:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }

      .ba-caption-bar {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 0.875rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .ba-points {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.75rem;
        margin-bottom: 2rem;
      }

      .ba-point {
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-subtle);
      }

      .ba-point-title {
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.2rem;
      }

      .ba-point-desc {
        font-size: 0.9375rem;
        color: var(--text-secondary);
      }

      /* =====================================================================
         6. GALERIA EM GRADE & LIGHTBOX
         ===================================================================== */
      .gallery-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }

      @media (min-width: 760px) {
        .gallery-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .gallery-item {
        text-align: left;
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 220ms var(--ease-out-expo),
          box-shadow 220ms var(--ease-out-expo),
          border-color 220ms var(--ease-out-expo);
      }

      .gallery-item:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
        border-color: var(--accent);
      }

      .gallery-thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        padding: 0.875rem 0.875rem 0;
        border-radius: calc(var(--radius-md) - 4px);
      }

      .gallery-item:hover .gallery-thumb .media-placeholder {
        border-color: color-mix(in srgb, var(--accent) 52%, transparent);
      }

      .gallery-zoom-hint {
        position: absolute;
        right: 1.375rem;
        bottom: 0.625rem;
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        background-color: var(--accent);
        color: var(--accent-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .gallery-item:hover .gallery-zoom-hint,
      .gallery-item:focus-visible .gallery-zoom-hint {
        opacity: 1;
      }

      .gallery-caption {
        padding: 1.125rem 1.25rem 1.25rem;
      }

      .gallery-caption-title {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .gallery-caption-sub {
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      /* Lightbox */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        background-color: rgba(9, 13, 18, 0.9);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms var(--ease-out-expo);
      }

      .lightbox.is-open {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-dialog {
        width: 100%;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .lightbox-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f8fafc;
      }

      .lightbox-counter {
        font-size: 0.875rem;
        color: #cbd5e1;
      }

      .lightbox-close,
      .lightbox-nav-btn {
        min-width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .lightbox-close:hover,
      .lightbox-nav-btn:hover {
        border-color: var(--accent);
        background-color: rgba(255, 255, 255, 0.08);
      }

      .lightbox-stage {
        aspect-ratio: 4 / 3;
        max-height: 68vh;
        width: 100%;
        border-radius: var(--radius-md);
        overflow: hidden;
        background-color: var(--bg-primary);
      }

      .lightbox-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        color: #f8fafc;
      }

      .lightbox-nav {
        display: flex;
        gap: 0.5rem;
      }

      /* =====================================================================
         7. SOBRE O PROFISSIONAL
         ===================================================================== */
      .about-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.75rem;
        align-items: stretch;
      }

      @media (min-width: 960px) {
        .about-grid {
          grid-template-columns: 5fr 7fr;
          gap: 4.5rem;
        }
      }

      .about-portrait-wrap {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }

      @media (min-width: 960px) {
        .about-portrait-wrap {
          aspect-ratio: 3 / 4;
          min-height: 500px;
          height: 100%;
        }
      }

      .about-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .about-prose {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
        margin-bottom: 2.25rem;
        color: var(--text-secondary);
        max-width: 60ch;
        line-height: 1.72;
      }

      .differentials-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        border-top: 1px solid var(--border-subtle);
        padding-top: 2rem;
      }

      @media (min-width: 640px) {
        .differentials-list {
          grid-template-columns: repeat(2, 1fr);
          gap: 1.5rem 2.25rem;
        }
      }

      .differential-item-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.3rem;
      }

      .differential-item-text {
        font-size: 0.9125rem;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      /* =====================================================================
         8. COMO FUNCIONA (4 Etapas)
         ===================================================================== */
      .steps-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      @media (min-width: 720px) {
        .steps-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1080px) {
        .steps-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .step-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: 1.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .step-num {
        font-family: var(--font-display);
        font-size: 1.875rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }

      .step-title {
        font-family: var(--font-display);
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.3;
      }

      .step-desc {
        font-size: 0.9125rem;
        color: var(--text-secondary);
        line-height: 1.62;
      }

      /* =====================================================================
         9. DEPOIMENTOS
         ===================================================================== */
      .testimonials-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }

      @media (min-width: 860px) {
        .testimonials-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .testimonial-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .testimonial-quote {
        font-size: 1.03125rem;
        line-height: 1.68;
        color: var(--text-primary);
      }

      .testimonial-author {
        padding-top: 1.125rem;
        border-top: 1px solid var(--border-subtle);
      }

      .testimonial-name {
        font-size: 0.9375rem;
        font-weight: 700;
        color: var(--text-primary);
      }

      .testimonial-meta {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-top: 0.2rem;
      }

      /* =====================================================================
         10. PERGUNTAS FREQUENTES (Acordeão)
         ===================================================================== */
      .faq-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      @media (min-width: 960px) {
        .faq-layout {
          grid-template-columns: 4fr 8fr;
          gap: 4.5rem;
        }
      }

      .faq-list {
        border-top: 1px solid var(--border-subtle);
      }

      .faq-item {
        border-bottom: 1px solid var(--border-subtle);
      }

      .faq-trigger {
        width: 100%;
        min-height: 58px;
        padding-block: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        text-align: left;
        font-size: 1.03125rem;
        font-weight: 600;
        color: var(--text-primary);
        transition: color 160ms ease;
      }

      .faq-trigger:hover {
        color: var(--accent);
      }

      .faq-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        color: var(--accent);
        transition: transform 220ms var(--ease-out-expo);
      }

      .faq-trigger[aria-expanded='true'] .faq-icon {
        transform: rotate(45deg);
      }

      .faq-panel {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 240ms var(--ease-out-expo);
      }

      .faq-panel.is-open {
        grid-template-rows: 1fr;
      }

      .faq-panel-inner {
        overflow: hidden;
      }

      .faq-answer {
        padding-bottom: 1.35rem;
        color: var(--text-secondary);
        font-size: 0.9375rem;
        line-height: 1.68;
        max-width: 65ch;
      }

      /* =====================================================================
         11. CHAMADA FINAL, LOCALIZAÇÃO GENÉRICA & FORMULÁRIO WHATSAPP
         ===================================================================== */
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.75rem;
        align-items: start;
      }

      @media (min-width: 960px) {
        .contact-grid {
          grid-template-columns: 5fr 7fr;
          gap: 4.5rem;
        }
      }

      .contact-direct {
        margin-top: 2rem;
        padding-top: 1.75rem;
        border-top: 1px solid var(--border-subtle);
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        font-size: 0.9375rem;
      }

      @media (min-width: 540px) {
        .contact-direct {
          grid-template-columns: repeat(2, 1fr);
          gap: 1.125rem 1.5rem;
        }
      }

      .contact-direct-wide {
        grid-column: 1 / -1;
      }

      .contact-direct-label {
        color: var(--text-muted);
        display: block;
        font-size: 0.8125rem;
        margin-bottom: 0.15rem;
      }

      .contact-direct-link {
        color: var(--text-primary);
        font-weight: 600;
        transition: color 160ms ease;
      }

      .contact-direct-link:hover {
        color: var(--accent);
      }

      .contact-direct-text {
        color: var(--text-primary);
        font-weight: 500;
        line-height: 1.55;
      }

      .contact-form-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        padding: 1.75rem;
      }

      @media (min-width: 640px) {
        .contact-form-card {
          padding: 2.5rem;
        }
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.15rem;
      }

      @media (min-width: 640px) {
        .form-grid-2 {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .field-label {
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--text-secondary);
      }

      .field-control {
        width: 100%;
        min-height: 46px;
        padding: 0.75rem 0.9375rem;
        background-color: var(--input-bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 0.9375rem;
        transition: border-color 160ms ease;
      }

      .field-control::placeholder {
        color: var(--text-muted);
      }

      .field-control:focus {
        outline: none;
        border-color: var(--accent);
      }

      textarea.field-control {
        min-height: 104px;
        resize: vertical;
      }

      .form-feedback {
        margin-top: 1rem;
        padding: 0.875rem 1rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        display: none;
        align-items: flex-start;
        gap: 0.625rem;
      }

      .form-feedback.is-error {
        display: flex;
        background-color: var(--error-bg);
        border: 1px solid var(--error-border);
        color: var(--error-text);
      }

      .form-confirmation {
        display: none;
        flex-direction: column;
        gap: 1.25rem;
      }

      .form-confirmation.is-visible {
        display: flex;
      }

      .form-confirmation-preview {
        padding: 1rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        color: var(--text-secondary);
        white-space: pre-line;
      }

      /* =====================================================================
         12. RODAPÉ
         ===================================================================== */
      .site-footer {
        background-color: var(--bg-primary);
        border-top: 1px solid var(--border-subtle);
        padding-block: 3rem 5rem;
      }

      @media (min-width: 768px) {
        .site-footer {
          padding-bottom: 3rem;
        }
      }

      .footer-top {
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border-subtle);
      }

      @media (min-width: 900px) {
        .footer-top {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      .footer-brand {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.25rem;
      }

      .footer-meta {
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 1.75rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
      }

      .footer-links a:hover {
        color: var(--accent);
      }

      .footer-bottom {
        padding-top: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      @media (min-width: 768px) {
        .footer-bottom {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      /* =====================================================================
         13. BOTÃO FLUTUANTE WHATSAPP
         ===================================================================== */
      .floating-whatsapp {
        position: fixed;
        right: 1.25rem;
        bottom: 1.25rem;
        z-index: 45;
        width: 54px;
        height: 54px;
        border-radius: 9999px;
        background-color: var(--accent);
        color: var(--accent-ink);
        border: 2px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.24);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 180ms var(--ease-out-expo),
          background-color 180ms var(--ease-out-expo);
      }

      .floating-whatsapp:hover {
        transform: translateY(-2px);
        background-color: var(--accent-hover);
      }

      /* =====================================================================
         ANIMAÇÕES DISCRETAS AO ROLAR
         ===================================================================== */
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 520ms var(--ease-out-expo),
          transform 520ms var(--ease-out-expo);
        overflow: visible;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }

        .service-card,
        .media-placeholder,
        .gallery-item,
        .btn,
        .floating-whatsapp {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===================================================================
         1. HEADER FIXO
         =================================================================== -->
    <header class="site-header" id="site-header">
      <div class="container header-inner">
        <a href="#inicio" class="brand-wordmark" id="brand-wordmark">
          <svg
            class="brand-monogram"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="26" height="26" rx="8" />
            <circle cx="16" cy="16" r="5.5" />
          </svg>
          <span id="brand-text">Sua Marca</span>
        </a>

        <nav class="nav-links" aria-label="Navegação principal">
          <a href="#servicos" class="nav-link" data-nav="servicos"></a>
          <a href="#galeria" class="nav-link" data-nav="galeria"></a>
          <a href="#sobre" class="nav-link" data-nav="sobre"></a>
          <a href="#como-funciona" class="nav-link" data-nav="atendimento"></a>
          <a href="#duvidas" class="nav-link" data-nav="duvidas"></a>
        </nav>

        <div class="header-actions">
          <a
            href="#"
            id="header-whatsapp-btn"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary header-cta"
          ></a>
          <button
            type="button"
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Abrir menu de navegação"
            aria-expanded="false"
            aria-controls="mobile-nav"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="4" y1="7" x2="20" y2="7" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <line x1="4" y1="17" x2="20" y2="17" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Menu Mobile -->
    <div class="mobile-nav" id="mobile-nav" aria-hidden="true">
      <ul class="mobile-nav-list">
        <li><a href="#servicos" class="mobile-nav-link" data-nav="servicos"></a></li>
        <li><a href="#antes-depois" class="mobile-nav-link" data-nav="antesDepois"></a></li>
        <li><a href="#galeria" class="mobile-nav-link" data-nav="galeria"></a></li>
        <li><a href="#sobre" class="mobile-nav-link" data-nav="sobre"></a></li>
        <li><a href="#como-funciona" class="mobile-nav-link" data-nav="atendimento"></a></li>
        <li><a href="#duvidas" class="mobile-nav-link" data-nav="duvidas"></a></li>
        <li><a href="#contato" class="mobile-nav-link" data-nav="contato"></a></li>
      </ul>
      <a
        href="#"
        id="mobile-whatsapp-btn"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary"
      ></a>
    </div>

    <main>
      <!-- ===================================================================
           2. HERO EM DUAS COLUNAS
           =================================================================== -->
      <section class="hero" id="inicio">
        <div class="container">
          <div class="hero-grid">
            <div>
              <p class="kicker" id="hero-kicker"></p>
              <h1 class="display-heading hero-title" id="hero-title"></h1>
              <p class="hero-subtitle" id="hero-subtitle"></p>
              <div class="hero-actions">
                <a
                  href="#"
                  id="hero-cta-whatsapp"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn btn-primary"
                ></a>
                <a href="#servicos" class="btn btn-outline" id="hero-cta-secondary"></a>
              </div>
            </div>

            <div class="hero-media-card" id="hero-placeholder-slot"></div>
          </div>
        </div>
      </section>

      <!-- ===================================================================
           3. NÚMEROS DE CREDIBILIDADE (Faixa única de cards)
           =================================================================== -->
      <section class="metrics-band" id="credibilidade-section" aria-label="Indicadores de atendimento">
        <div class="container">
          <div class="metrics-grid" id="metrics-grid"></div>
        </div>
      </section>

      <!-- ===================================================================
           4. SERVIÇOS (3 ou 6 cards)
           =================================================================== -->
      <section class="section" id="servicos">
        <div class="container">
          <div class="section-header section-header-split reveal">
            <div>
              <p class="kicker" id="services-kicker"></p>
              <h2 class="display-heading section-title" id="services-title"></h2>
            </div>
            <p class="section-lead" id="services-subtitle"></p>
          </div>

          <div class="services-grid" id="services-grid"></div>
        </div>
      </section>

      <!-- ===================================================================
           5. ANTES E DEPOIS COM SLIDER INTERATIVO
           =================================================================== -->
      <section class="section section-surface" id="antes-depois">
        <div class="container">
          <div class="ba-layout">
            <div class="reveal">
              <div class="ba-stage" id="ba-stage">
                <div class="ba-layer ba-layer-before">
                  <div class="ba-placeholder ba-placeholder-before">
                    <div class="ba-slot-badge ba-slot-before">
                      <span class="media-placeholder-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="3" y="3" width="18" height="18" rx="3" />
                          <circle cx="8.5" cy="8.5" r="1.5" />
                          <polyline points="21 15 16 10 5 21" />
                        </svg>
                      </span>
                      <span class="media-placeholder-label" id="ba-slot-label-before">Imagem antes</span>
                    </div>
                  </div>
                </div>
                <div class="ba-layer ba-layer-after" id="ba-layer-after">
                  <div class="ba-placeholder ba-placeholder-after">
                    <div class="ba-slot-badge ba-slot-after">
                      <span class="media-placeholder-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                          <rect x="3" y="3" width="18" height="18" rx="3" />
                          <circle cx="8.5" cy="8.5" r="1.5" />
                          <polyline points="21 15 16 10 5 21" />
                        </svg>
                      </span>
                      <span class="media-placeholder-label" id="ba-slot-label-after">Imagem depois</span>
                    </div>
                  </div>
                </div>
                <div class="ba-divider" id="ba-divider" aria-hidden="true">

         MOTOR DE RENDERIZAÇÃO (Lê diretamente o objeto CONFIG acima)
         ===================================================================== */
      (function initSite() {
        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) => document.querySelectorAll(selector);

        const escapeHTML = (str) =>
          String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        const imageIconSVG = `
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        `;

        const createPlaceholderHTML = (label) => `
          <div class="media-placeholder" role="img" aria-label="${escapeHTML(label)}">
            <span class="media-placeholder-icon" aria-hidden="true">
              ${imageIconSVG}
            </span>
            <span class="media-placeholder-label">${escapeHTML(label)}</span>
          </div>
        `;

        const marcaAtiva = CONFIG.marca || 'Sua Marca';
        const whatsappAtivo = String(CONFIG.contato.whatsapp || '').replace(/\D/g, '');
        const whatsappExibicaoAtivo = CONFIG.contato.whatsappExibicao || '(00) 00000-0000';
        const emailAtivo = CONFIG.contato.email || 'contato@seudominio.com';
        const instaHandle = CONFIG.contato.instagram || '@seuperfil';
        const instaUser = instaHandle.replace(/^@/, '');
        const instagramUrlAtivo = `https://instagram.com/${instaUser}`;

        // 1. Aplicar paleta de cores e tipografia do CONFIG
        const tema = CONFIG.tema;
        const root = document.documentElement;
        root.style.setProperty('--bg-primary', tema.corPrincipal);
        root.style.setProperty('--bg-surface', tema.corSuperficie);
        root.style.setProperty('--bg-card', tema.corCard);
        root.style.setProperty('--accent', tema.corDestaque);
        root.style.setProperty('--accent-hover', tema.corDestaqueHover);
        root.style.setProperty('--accent-ink', tema.corDestaqueTexto);
        root.style.setProperty('--accent-soft', `color-mix(in srgb, ${tema.corDestaque} 12%, transparent)`);
        root.style.setProperty('--font-display', tema.fonteTitulo);

        const faviconEl = $('#site-favicon');
        if (faviconEl) {
          const bgHex = encodeURIComponent(tema.corDestaque);
          const strokeHex = encodeURIComponent(tema.corDestaqueTexto || '#FFFFFF');
          faviconEl.href = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='${bgHex}'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='${strokeHex}' stroke-width='4'/%3E%3C/svg%3E`;
        }

        const buildWhatsAppUrl = (message) => {
          const text = encodeURIComponent(message || CONFIG.whatsappMensagemPadrao);
          return whatsappAtivo
            ? `https://wa.me/${whatsappAtivo}?text=${text}`
            : `https://wa.me/?text=${text}`;
        };

        const defaultWaUrl = buildWhatsAppUrl(CONFIG.whatsappMensagemPadrao);

        // 2. SEO & Schema.org
        const pageTitle = `${marcaAtiva} | ${CONFIG.profissao}`;
        const pageDescription = CONFIG.hero.subtitulo;
        document.title = pageTitle;

        const metaDesc = document.querySelector('meta[name="description"]');
        const ogSite = document.querySelector('meta[property="og:site_name"]');
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        const twTitle = document.querySelector('meta[name="twitter:title"]');
        const twDesc = document.querySelector('meta[name="twitter:description"]');

        if (metaDesc) metaDesc.setAttribute('content', pageDescription);
        if (ogSite) ogSite.setAttribute('content', marcaAtiva);
        if (ogTitle) ogTitle.setAttribute('content', pageTitle);
        if (ogDesc) ogDesc.setAttribute('content', pageDescription);
        if (twTitle) twTitle.setAttribute('content', pageTitle);
        if (twDesc) twDesc.setAttribute('content', pageDescription);

        const jsonLdEl = $('#schema-jsonld');
        if (jsonLdEl) {
          jsonLdEl.textContent = JSON.stringify({
            '@context': 'https://schema.org',
            '@type': 'ProfessionalService',
            name: `${marcaAtiva} — ${CONFIG.profissao}`,
            description: pageDescription,
            email: emailAtivo
          });
        }

        // 3. Header e Navegação
        const R = CONFIG.rotulos;
        Object.entries(R.nav).forEach(([key, label]) => {
          $$(`[data-nav="${key}"]`).forEach((el) => {
            el.textContent = label;
          });
        });

        $('#brand-text').textContent = marcaAtiva;
        const headerWaBtn = $('#header-whatsapp-btn');
        headerWaBtn.textContent = R.botoes.headerWhatsapp;
        headerWaBtn.href = defaultWaUrl;

        const mobileWaBtn = $('#mobile-whatsapp-btn');
        mobileWaBtn.textContent = R.botoes.headerWhatsapp;
        mobileWaBtn.href = defaultWaUrl;

        $('#floating-whatsapp').href = defaultWaUrl;

        // 4. Hero em Duas Colunas (com placeholder elegante)
        $('#hero-kicker').textContent = CONFIG.hero.sobretitulo;
        $('#hero-title').textContent = CONFIG.hero.titulo;
        $('#hero-subtitle').textContent = CONFIG.hero.subtitulo;

        const heroWaBtn = $('#hero-cta-whatsapp');
        heroWaBtn.textContent = CONFIG.hero.ctaWhatsapp;
        heroWaBtn.href = defaultWaUrl;

        const heroSecondaryBtn = $('#hero-cta-secondary');
        heroSecondaryBtn.textContent = CONFIG.hero.ctaSecundario;

        $('#hero-placeholder-slot').innerHTML = createPlaceholderHTML(
          CONFIG.hero.placeholderTexto || 'Sua foto aqui'
        );

        // 5. Números de Credibilidade (Faixa única de cards)
        const metricsGrid = $('#metrics-grid');
        const credibilidade = Array.isArray(CONFIG.credibilidade) ? CONFIG.credibilidade : [];
        if (credibilidade.length === 0) {
          $('#credibilidade-section').style.display = 'none';
        } else {
          metricsGrid.innerHTML = credibilidade
            .map(
              (item, idx) => `
              <div class="metric-item reveal">
                <div class="metric-value tabular" data-target="${Number(item.numero)}" data-suffix="${escapeHTML(item.sufixo || '')}" id="metric-num-${idx}">
                  0${escapeHTML(item.sufixo || '')}
                </div>
                <div class="metric-label">${escapeHTML(item.label)}</div>
                <div class="metric-context">${escapeHTML(item.contexto)}</div>
              </div>
            `
            )
            .join('');
        }

        // 6. Serviços (3 ou 6 cards sem card solitário)
        const servicesSection = $('#servicos');
        const servicos = Array.isArray(CONFIG.servicos) ? CONFIG.servicos : [];
        if (servicos.length === 0) {
          servicesSection.style.display = 'none';
          $$('a[href="#servicos"]').forEach((l) => {
            l.style.display = 'none';
          });
          heroSecondaryBtn.href = '#sobre';
        } else {
          $('#services-kicker').textContent = R.secoes.servicos.sobretitulo;
          $('#services-title').textContent = R.secoes.servicos.titulo;
          $('#services-subtitle').textContent = R.secoes.servicos.subtitulo;

          $('#services-grid').innerHTML = servicos
            .map((srv) => {
              const waLink = buildWhatsAppUrl(
                `Olá! Gostaria de mais informações sobre "${srv.nome}".`
              );
              const hasPrice = Boolean(srv.preco && String(srv.preco).trim());

              return `
                <article class="service-card reveal">
                  <div class="service-media">
                    ${createPlaceholderHTML(srv.placeholderTexto || 'Sua imagem aqui')}
                  </div>
                  <div class="service-body">
                    ${srv.categoria ? `<div class="service-category">${escapeHTML(srv.categoria)}</div>` : ''}
                    <h3 class="service-title">${escapeHTML(srv.nome)}</h3>
                    <p class="service-desc">${escapeHTML(srv.descricao)}</p>
                    <div class="service-footer">
                      ${hasPrice ? `<span class="service-price tabular">${escapeHTML(srv.preco)}</span>` : ''}
                      <a
                        href="${waLink}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="btn btn-outline btn-sm"
                        style="${hasPrice ? '' : 'width: 100%;'}"
                      >
                        ${escapeHTML(R.botoes.cardServico)}
                      </a>
                    </div>
                  </div>
                </article>
              `;
            })
            .join('');
        }

        // 7. Antes e Depois (Slider interativo com os dois placeholders)
        const baSection = $('#antes-depois');
        const ba = CONFIG.antesDepois;
        if (!ba) {
          baSection.style.display = 'none';
          $$('a[href="#antes-depois"]').forEach((l) => {
            l.style.display = 'none';
          });
          const galeriaEl = $('#galeria');
          if (galeriaEl) {
            galeriaEl.style.borderTop = '1px solid var(--border-subtle)';
          }
        } else {
          $('#ba-kicker').textContent = ba.sobretitulo;
          $('#ba-title').textContent = ba.titulo;
          $('#ba-subtitle').textContent = ba.subtitulo;
          $('#ba-slot-label-before').textContent = ba.labelAntes || 'Imagem antes';
          $('#ba-slot-label-after').textContent = ba.labelDepois || 'Imagem depois';
          $('#ba-label-before').textContent = ba.legendaEsquerda || ba.labelAntes || 'Imagem antes';
          $('#ba-label-after').textContent = ba.legendaDireita || ba.labelDepois || 'Imagem depois';

          const baCta = $('#ba-cta');
          baCta.textContent = ba.ctaTexto;
          baCta.href = defaultWaUrl;

          $('#ba-points').innerHTML = (ba.pontos || [])
            .map(
              (pt) => `
              <div class="ba-point">
                <div class="ba-point-title">${escapeHTML(pt.titulo)}</div>
                <div class="ba-point-desc">${escapeHTML(pt.texto)}</div>
              </div>
            `
            )
            .join('');

          const baRange = $('#ba-range');
          const baAfterLayer = $('#ba-layer-after');
          const baDivider = $('#ba-divider');
          const updateSlider = (val) => {
            const pct = Math.max(5, Math.min(95, Number(val)));
            baAfterLayer.style.clipPath = `inset(0 0 0 ${pct}%)`;
            baDivider.style.left = `${pct}%`;
          };
          baRange.addEventListener('input', (e) => updateSlider(e.target.value));
          updateSlider(50);
        }

        // 8. Galeria & Lightbox (Placeholders elegantes)
        const galeriaSection = $('#galeria');
        const galeria = Array.isArray(CONFIG.galeria) ? CONFIG.galeria : [];
        if (galeria.length === 0) {
          galeriaSection.style.display = 'none';
          $$('a[href="#galeria"]').forEach((l) => {
            l.style.display = 'none';
          });
        } else {
          $('#gallery-kicker').textContent = R.secoes.galeria.sobretitulo;
          $('#gallery-title').textContent = R.secoes.galeria.titulo;
          $('#gallery-subtitle').textContent = R.secoes.galeria.subtitulo;

          const galleryGrid = $('#gallery-grid');
          galleryGrid.innerHTML = galeria
            .map(
              (item, index) => `
              <button
                type="button"
                class="gallery-item reveal"
                data-gallery-index="${index}"
                aria-label="Ampliar: ${escapeHTML(item.titulo)}"
              >
                <div class="gallery-thumb">
                  ${createPlaceholderHTML(item.placeholderTexto || 'Sua imagem aqui')}
                  <span class="gallery-zoom-hint" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="15 3 21 3 21 9" />
                      <polyline points="9 21 3 21 3 15" />
                      <line x1="21" y1="3" x2="14" y2="10" />
                      <line x1="3" y1="21" x2="10" y2="14" />
                    </svg>
                  </span>
                </div>
                <div class="gallery-caption">
                  <div class="gallery-caption-title">${escapeHTML(item.titulo)}</div>
                  ${item.legenda ? `<div class="gallery-caption-sub">${escapeHTML(item.legenda)}</div>` : ''}
                </div>
              </button>
            `
            )
            .join('');

          const lightbox = $('#gallery-lightbox');
          const lbStage = $('#lightbox-stage');
          const lbTitle = $('#lightbox-title');
          const lbSubtitle = $('#lightbox-subtitle');
          const lbCounter = $('#lightbox-counter');
          const lbClose = $('#lightbox-close');
          const lbPrev = $('#lightbox-prev');
          const lbNext = $('#lightbox-next');
          let currentIndex = 0;

          const updateLightbox = (idx) => {
            currentIndex = (idx + galeria.length) % galeria.length;
            const item = galeria[currentIndex];
            lbStage.innerHTML = createPlaceholderHTML(item.placeholderTexto || 'Sua imagem aqui');
            lbTitle.textContent = item.titulo;
            lbSubtitle.textContent = item.legenda || '';
            lbCounter.textContent = `${currentIndex + 1} / ${galeria.length}`;
          };

          const openLightbox = (idx) => {
            updateLightbox(idx);
            lightbox.classList.add('is-open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            lbClose.focus();
          };

          const closeLightbox = () => {
            lightbox.classList.remove('is-open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
          };

          galleryGrid.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-gallery-index]');
            if (!btn) return;
            openLightbox(Number(btn.getAttribute('data-gallery-index')));
          });

          lbClose.addEventListener('click', closeLightbox);
          lbPrev.addEventListener('click', () => updateLightbox(currentIndex - 1));
          lbNext.addEventListener('click', () => updateLightbox(currentIndex + 1));
          lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) closeLightbox();
          });

          document.addEventListener('keydown', (event) => {
            if (!lightbox.classList.contains('is-open')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') updateLightbox(currentIndex - 1);
            if (event.key === 'ArrowRight') updateLightbox(currentIndex + 1);
          });
        }

        // 9. Sobre o Profissional
        $('#about-placeholder-slot').innerHTML = createPlaceholderHTML(
          CONFIG.sobre.placeholderTexto || 'Sua foto aqui'
        );
        $('#about-kicker').textContent = R.secoes.sobre.sobretitulo;
        $('#about-title').textContent = CONFIG.sobre.titulo;
        $('#about-prose').innerHTML = (CONFIG.sobre.paragrafos || [])
          .map((p) => `<p>${escapeHTML(p)}</p>`)
          .join('');
        $('#about-differentials').innerHTML = (CONFIG.sobre.diferenciais || [])
          .map(
            (dif) => `
            <div>
              <h3 class="differential-item-title">${escapeHTML(dif.titulo)}</h3>
              <p class="differential-item-text">${escapeHTML(dif.texto)}</p>
            </div>
          `
          )
          .join('');

        // 10. Como Funciona (4 Etapas)
        $('#steps-kicker').textContent = R.secoes.atendimento.sobretitulo;
        $('#steps-title').textContent = R.secoes.atendimento.titulo;
        $('#steps-subtitle').textContent = R.secoes.atendimento.subtitulo;
        $('#steps-grid').innerHTML = (CONFIG.etapas || [])
          .map(
            (step) => `
            <article class="step-card reveal">
              <span class="step-num tabular">${escapeHTML(step.numero)}</span>
              <h3 class="step-title">${escapeHTML(step.titulo)}</h3>
              <p class="step-desc">${escapeHTML(step.descricao)}</p>
            </article>
          `
          )
          .join('');

        // 11. Depoimentos
        $('#testimonials-kicker').textContent = R.secoes.depoimentos.sobretitulo;
        $('#testimonials-title').textContent = R.secoes.depoimentos.titulo;
        $('#testimonials-subtitle').textContent = R.secoes.depoimentos.subtitulo;
        $('#testimonials-grid').innerHTML = (CONFIG.depoimentos || [])
          .map(
            (dep) => `
            <article class="testimonial-card reveal">
              <blockquote class="testimonial-quote">“${escapeHTML(dep.texto)}”</blockquote>
              <footer class="testimonial-author">
                <div class="testimonial-name">${escapeHTML(dep.autor)}</div>
                <div class="testimonial-meta">${escapeHTML(dep.contexto)}</div>
              </footer>
            </article>
          `
          )
          .join('');

        // 12. Perguntas Frequentes
        $('#faq-kicker').textContent = R.secoes.faq.sobretitulo;
        $('#faq-title').textContent = R.secoes.faq.titulo;
        $('#faq-subtitle').textContent = R.secoes.faq.subtitulo;
        const faqList = $('#faq-list');
        faqList.innerHTML = (CONFIG.faq || [])
          .map(
            (item, idx) => `
            <div class="faq-item">
              <button
                type="button"
                class="faq-trigger"
                aria-expanded="${idx === 0 ? 'true' : 'false'}"
                aria-controls="faq-panel-${idx}"
                id="faq-btn-${idx}"
              >
                <span>${escapeHTML(item.pergunta)}</span>
                <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </button>
              <div
                class="faq-panel ${idx === 0 ? 'is-open' : ''}"
                id="faq-panel-${idx}"
                role="region"
                aria-labelledby="faq-btn-${idx}"
              >
                <div class="faq-panel-inner">
                  <p class="faq-answer">${escapeHTML(item.resposta)}</p>
                </div>
              </div>
            </div>
          `
          )
          .join('');

        faqList.addEventListener('click', (event) => {
          const trigger = event.target.closest('.faq-trigger');
          if (!trigger) return;
          const isExpanded = trigger.getAttribute('aria-expanded') === 'true';
          const panel = document.getElementById(trigger.getAttribute('aria-controls'));

          faqList.querySelectorAll('.faq-trigger').forEach((btn) => {
            btn.setAttribute('aria-expanded', 'false');
          });
          faqList.querySelectorAll('.faq-panel').forEach((el) => {
            el.classList.remove('is-open');
          });

          if (!isExpanded && panel) {
            trigger.setAttribute('aria-expanded', 'true');
            panel.classList.add('is-open');
          }
        });

        // 13. Chamada Final, Localização Genérica & Formulário WhatsApp
        $('#contact-kicker').textContent = R.secoes.contato.sobretitulo;
        $('#contact-title').textContent = CONFIG.contatoFinal.titulo;
        $('#contact-subtitle').textContent = CONFIG.contatoFinal.subtitulo;
        $('#contact-label-whatsapp').textContent = R.secoes.contato.labelWhatsapp;
        $('#contact-label-email').textContent = R.secoes.contato.labelEmail;
        $('#contact-label-instagram').textContent = R.secoes.contato.labelInstagram;
        $('#contact-label-schedule').textContent = CONFIG.contato.horariosTitulo;
        $('#contact-schedule-text').textContent = CONFIG.contato.horariosTexto;
        $('#contact-label-location').textContent = CONFIG.contato.localizacaoTitulo;
        $('#contact-location-text').textContent = CONFIG.contato.localizacaoTexto;

        const contactWaLink = $('#contact-whatsapp-link');
        contactWaLink.textContent = whatsappExibicaoAtivo;
        contactWaLink.href = defaultWaUrl;

        const contactEmailLink = $('#contact-email-link');
        contactEmailLink.textContent = emailAtivo;
        contactEmailLink.href = `mailto:${emailAtivo}`;

        const contactInstaLink = $('#contact-instagram-link');
        contactInstaLink.textContent = instaHandle;
        contactInstaLink.href = instagramUrlAtivo;

        const F = R.secoes.formulario;
        $('#form-label-name').textContent = F.labelNome;
        $('#lead-name').placeholder = F.placeholderNome;
        $('#form-label-phone').textContent = F.labelTelefone;
        $('#lead-phone').placeholder = F.placeholderTelefone;
        $('#form-label-intent').textContent = F.labelObjetivo;
        $('#form-label-message').textContent = F.labelMensagem;
        $('#lead-message').placeholder = F.placeholderMensagem;
        $('#form-submit-btn').textContent = R.botoes.enviarFormulario;
        $('#form-confirm-kicker').textContent = F.confirmacaoSobretitulo;
        $('#form-confirm-title').textContent = F.confirmacaoTitulo;
        $('#form-confirm-subtitle').textContent = F.confirmacaoSubtitulo;
        $('#form-whatsapp-launch').textContent = R.botoes.abrirWhatsappFormulario;
        $('#form-reset-btn').textContent = R.botoes.editarFormulario;

        const intentSelect = $('#lead-intent');
        const opcoesSelect = [
          ...servicos.map((s) => s.nome),
          'Agendar atendimento inicial',
          'Outras dúvidas'
        ];
        intentSelect.innerHTML = opcoesSelect
          .map((opt) => `<option value="${escapeHTML(opt)}">${escapeHTML(opt)}</option>`)
          .join('');

        const form = $('#whatsapp-form');
        const errorBox = $('#form-error');
        const errorText = $('#form-error-text');
        const confirmationBox = $('#form-confirmation');
        const previewText = $('#form-preview-text');
        const launchBtn = $('#form-whatsapp-launch');
        const resetBtn = $('#form-reset-btn');

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          errorBox.classList.remove('is-error');

          const nome = $('#lead-name').value.trim();
          const telefone = $('#lead-phone').value.trim();
          const assunto = $('#lead-intent').value;
          const mensagem = $('#lead-message').value.trim();

          if (nome.length < 2) {
            errorText.textContent = 'Por favor, informe seu nome para iniciar o atendimento.';
            errorBox.classList.add('is-error');
            $('#lead-name').focus();
            return;
          }

          const digits = telefone.replace(/\D/g, '');
          if (digits.length < 10) {
            errorText.textContent = 'Informe um número de WhatsApp válido com DDD.';
            errorBox.classList.add('is-error');
            $('#lead-phone').focus();
            return;
          }

          const lines = [
            `Olá! Meu nome é ${nome}.`,
            `Assunto: ${assunto}.`
          ];
          if (mensagem) lines.push(`Mensagem: ${mensagem}`);
          lines.push(`Meu WhatsApp para retorno: ${telefone}.`);

          const compiledMessage = lines.join('\n');
          previewText.textContent = compiledMessage;
          launchBtn.href = buildWhatsAppUrl(compiledMessage);

          form.style.display = 'none';
          confirmationBox.classList.add('is-visible');
        });

        resetBtn.addEventListener('click', () => {
          confirmationBox.classList.remove('is-visible');
          form.style.display = 'block';
        });

        // 14. Rodapé
        const currentYear = new Date().getFullYear();
        $('#footer-brand').textContent = marcaAtiva;
        $('#footer-tagline').textContent = R.secoes.rodape.tagline;

        const igLink = $('#footer-instagram');
        igLink.textContent = `Instagram (${instaHandle})`;
        igLink.href = instagramUrlAtivo;

        const footerEmail = $('#footer-email');
        footerEmail.textContent = emailAtivo;
        footerEmail.href = `mailto:${emailAtivo}`;

        $('#footer-rights').textContent = `© ${currentYear} ${marcaAtiva}. Todos os direitos reservados.`;
        $('#footer-profession').textContent = CONFIG.profissao;

        // 15. Header Fixo e Drawer Mobile
        const header = $('#site-header');
        const handleScrollHeader = () => {
          header.classList.toggle('is-scrolled', window.scrollY > 24);
        };
        window.addEventListener('scroll', handleScrollHeader, { passive: true });
        handleScrollHeader();

        const menuToggle = $('#menu-toggle');
        const mobileNav = $('#mobile-nav');
        const setMobileMenu = (open) => {
          menuToggle.setAttribute('aria-expanded', String(open));
          mobileNav.setAttribute('aria-hidden', String(!open));
          mobileNav.classList.toggle('is-open', open);
          document.body.style.overflow = open ? 'hidden' : '';
        };

        menuToggle.addEventListener('click', () => {
          setMobileMenu(!mobileNav.classList.contains('is-open'));
        });

        mobileNav.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => setMobileMenu(false));
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && mobileNav.classList.contains('is-open')) {
            setMobileMenu(false);
            menuToggle.focus();
          }
        });

        window.addEventListener('resize', () => {
          if (window.innerWidth >= 980 && mobileNav.classList.contains('is-open')) {
            setMobileMenu(false);
          }
        });

        // 16. Contagem Animada & Reveal Discreto
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const metricEls = document.querySelectorAll('.metric-value[data-target]');
        let metricsAnimated = false;

        const runMetricCounters = () => {
          if (metricsAnimated) return;
          metricsAnimated = true;

          metricEls.forEach((el) => {
            const target = Number(el.getAttribute('data-target') || 0);
            const suffix = el.getAttribute('data-suffix') || '';

            if (prefersReducedMotion) {
              el.textContent = `${target}${suffix}`;
              return;
            }

            const duration = 1100;
            const startTime = performance.now();

            const step = (now) => {
              const progress = Math.min((now - startTime) / duration, 1);
              const eased = 1 - Math.pow(1 - progress, 3);
              el.textContent = `${Math.round(target * eased)}${suffix}`;
              if (progress < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          });
        };

        if ('IntersectionObserver' in window) {
          if (credibilidade.length > 0) {
            const metricsObserver = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    runMetricCounters();
                    metricsObserver.disconnect();
                  }
                });
              },
              { threshold: 0.3 }
            );
            metricsObserver.observe(metricsGrid);
          }

          const revealEls = document.querySelectorAll('.reveal');
          if (prefersReducedMotion) {
            revealEls.forEach((el) => el.classList.add('is-visible'));
          } else {
            const revealObserver = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
            );
            revealEls.forEach((el) => revealObserver.observe(el));
          }
        } else {
          runMetricCounters();
          document.querySelectorAll('.reveal').forEach((el) => el.classList.add('is-visible'));
        }
      })();
    </script>
  </body>
</html>
