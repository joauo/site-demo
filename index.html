            ? `https://wa.me/${whatsappAtivo}?text=${text}`
            : `https://wa.me/?text=${text}`;
        };

        // 3. SEO, Open Graph e Schema.org
        const pageTitle = `${nomeAtivo} | ${PRESET.profissao} em ${cidadeAtiva}`;
        const pageDescription = replaceTokens(PRESET.hero.subtitulo);
        document.title = pageTitle;

        const metaDesc = document.querySelector('meta[name="description"]');
        const ogSite = document.querySelector('meta[property="og:site_name"]');
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        const twTitle = document.querySelector('meta[name="twitter:title"]');
        const twDesc = document.querySelector('meta[name="twitter:description"]');

        if (metaDesc) metaDesc.setAttribute('content', pageDescription);
        if (ogSite) ogSite.setAttribute('content', nomeAtivo);
        if (ogTitle) ogTitle.setAttribute('content', pageTitle);
        if (ogDesc) ogDesc.setAttribute('content', pageDescription);
        if (twTitle) twTitle.setAttribute('content', pageTitle);
        if (twDesc) twDesc.setAttribute('content', pageDescription);

        const jsonLdEl = $('#schema-jsonld');
        if (jsonLdEl) {
          jsonLdEl.textContent = JSON.stringify({
            '@context': 'https://schema.org',
            '@type': 'ProfessionalService',
            name: `${nomeAtivo} — ${PRESET.profissao}`,
            description: pageDescription,
            areaServed: cidadeAtiva,
            email: emailAtivo
          });
        }

        // 4. Rótulos de Navegação e Botões Globais
        const R = CONFIG.rotulos;
        Object.entries(R.nav).forEach(([key, label]) => {
          $$(`[data-nav="${key}"]`).forEach((el) => {
            el.textContent = label;
          });
        });

        $('#brand-wordmark').textContent = nomeAtivo;
        const defaultWaUrl = buildWhatsAppUrl(defaultWaMessage);

        const headerWaBtn = $('#header-whatsapp-btn');
        headerWaBtn.textContent = R.botoes.headerWhatsapp;
        headerWaBtn.href = defaultWaUrl;

        const mobileWaBtn = $('#mobile-whatsapp-btn');
        mobileWaBtn.textContent = R.botoes.headerWhatsapp;
        mobileWaBtn.href = defaultWaUrl;

        const floatingWa = $('#floating-whatsapp');
        floatingWa.href = defaultWaUrl;
        floatingWa.setAttribute('aria-label', R.botoes.whatsappFlutuanteAria);

        // 5. Hero
        $('#hero-kicker').textContent = replaceTokens(PRESET.hero.sobretitulo);
        $('#hero-title').textContent = replaceTokens(PRESET.hero.titulo);
        $('#hero-subtitle').textContent = replaceTokens(PRESET.hero.subtitulo);

        const heroPrimaryBtn = $('#hero-cta-primary');
        heroPrimaryBtn.textContent = PRESET.hero.ctaPrimario || R.botoes.heroPrimario;

        const heroWaBtn = $('#hero-cta-whatsapp');
        heroWaBtn.textContent = PRESET.hero.ctaSecundario || R.botoes.heroSecundario;
        heroWaBtn.href = defaultWaUrl;

        const heroImg = $('#hero-image');
        heroImg.src = resolveImage(CONFIG.imagens.hero);
        heroImg.alt = CONFIG.imagens.heroAlt;

        // 6. Números de Credibilidade
        const metricsGrid = $('#metrics-grid');
        const credibilidade = PRESET.credibilidade || [];
        if (credibilidade.length === 0) {
          $('#credibilidade-section').style.display = 'none';
        } else {
          metricsGrid.innerHTML = credibilidade
            .map(
              (item, idx) => `
              <div class="metric-item">
                <div class="metric-value tabular" data-target="${Number(item.numero)}" data-suffix="${escapeHTML(item.sufixo || '')}" id="metric-num-${idx}">
                  0${escapeHTML(item.sufixo || '')}
                </div>
                <div class="metric-label">${escapeHTML(replaceTokens(item.label))}</div>
                <div class="metric-context">${escapeHTML(replaceTokens(item.contexto))}</div>
              </div>
            `
            )
            .join('');
        }

        // 7. Serviços (Grade sem cards solitários, oculta se vazio)
        const servicesSection = $('#servicos');
        const servicos = Array.isArray(PRESET.servicos) ? PRESET.servicos : [];

        if (servicos.length === 0) {
          servicesSection.style.display = 'none';
          $$('a[href="#servicos"]').forEach((link) => {
            link.style.display = 'none';
          });
          heroPrimaryBtn.href = '#sobre';
        } else {
          $('#services-kicker').textContent = R.secoes.servicos.sobretitulo;
          $('#services-title').textContent = R.secoes.servicos.titulo;
          $('#services-subtitle').textContent = R.secoes.servicos.subtitulo;

          const filtersContainer = $('#service-filters');
          const servicesGrid = $('#services-grid');
          const categoriasUnicas = [
            ...new Set(servicos.map((item) => item.categoria).filter(Boolean))
          ];
          // Só exibe filtro se cada categoria tiver ao menos 2 itens, evitando linhas solitárias
          const todasCategoriasBalanceadas = categoriasUnicas.every(
            (cat) => servicos.filter((item) => item.categoria === cat).length >= 2
          );
          const usaFiltro = categoriasUnicas.length > 1 && todasCategoriasBalanceadas;
          const allLabel = R.secoes.servicos.filtroTodos;
          let activeCategoria = allLabel;

          const renderFilters = () => {
            if (!usaFiltro) {
              filtersContainer.style.display = 'none';
              return;
            }
            const opcoes = [allLabel, ...categoriasUnicas];
            filtersContainer.innerHTML = opcoes
              .map(
                (cat) => `
                <button
                  type="button"
                  class="filter-btn ${cat === activeCategoria ? 'is-active' : ''}"
                  data-categoria="${escapeHTML(cat)}"
                  aria-pressed="${cat === activeCategoria}"
                >
                  ${escapeHTML(cat)}
                </button>
              `
              )
              .join('');
          };

          const renderServices = () => {
            const list =
              !usaFiltro || activeCategoria === allLabel
                ? servicos
                : servicos.filter((item) => item.categoria === activeCategoria);

            servicesGrid.classList.remove('cols-2', 'cols-4');
            if (list.length === 2) servicesGrid.classList.add('cols-2');
            else if (list.length === 4) servicesGrid.classList.add('cols-4');

            servicesGrid.innerHTML = list
              .map((srv) => {
                const srvNome = replaceTokens(srv.nome);
                const waMsg = `Olá, ${nomeAtivo}! Gostaria de mais informações sobre "${srvNome}".`;
                const waLink = buildWhatsAppUrl(waMsg);
                const hasPrice = Boolean(srv.preco && String(srv.preco).trim());
                const imgSrc = resolveImage(srv.imagem);

                return `
                  <article class="service-card">
                    <div class="service-media">
                      <img
                        src="${escapeHTML(imgSrc)}"
                        alt="${escapeHTML(srvNome)}"
                        loading="lazy"
                        referrerpolicy="no-referrer"
                        onerror="this.style.display='none'; this.nextElementSibling.classList.add('is-visible');"
                      />
                      <div class="image-fallback" aria-hidden="true">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                          <rect x="3" y="4" width="18" height="16" rx="2" />
                          <line x1="7" y1="9" x2="17" y2="9" />
                          <line x1="7" y1="13" x2="13" y2="13" />
                        </svg>
                        <span style="font-size: 0.875rem; font-weight: 500">${escapeHTML(srvNome)}</span>
                      </div>
                    </div>
                    <div class="service-body">
                      ${srv.categoria ? `<div class="service-category">${escapeHTML(srv.categoria)}</div>` : ''}
                      <h3 class="service-title">${escapeHTML(srvNome)}</h3>
                      <p class="service-desc">${escapeHTML(replaceTokens(srv.descricao))}</p>
                      <div class="service-footer ${hasPrice ? '' : 'no-price'}">
                        ${hasPrice ? `<span class="service-price tabular">${escapeHTML(srv.preco)}</span>` : ''}
                        <a
                          href="${waLink}"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="btn btn-outline service-cta"
                        >
                          ${escapeHTML(R.botoes.cardServico)}
                        </a>
                      </div>
                    </div>
                  </article>
                `;
              })
              .join('');
          };

          renderFilters();
          renderServices();

          filtersContainer.addEventListener('click', (event) => {
            const button = event.target.closest('.filter-btn');
            if (!button) return;
            activeCategoria = button.getAttribute('data-categoria') || allLabel;
            renderFilters();
            renderServices();
          });
        }

        // 8. Galeria de Trabalhos & Ambientes (Opcional por preset + Lightbox)
        const galeriaSection = $('#galeria');
        const galeria = Array.isArray(PRESET.galeria) ? PRESET.galeria : [];
        if (galeria.length === 0) {
          galeriaSection.style.display = 'none';
          $$('a[href="#galeria"]').forEach((link) => {
            link.style.display = 'none';
          });
        } else {
          $('#gallery-kicker').textContent = R.secoes.galeria.sobretitulo;
          $('#gallery-title').textContent = R.secoes.galeria.titulo;
          $('#gallery-subtitle').textContent = R.secoes.galeria.subtitulo;

          const galleryGrid = $('#gallery-grid');
          if (galeria.length === 8) galleryGrid.classList.add('cols-4');

          galleryGrid.innerHTML = galeria
            .map((item, index) => {
              const titulo = replaceTokens(item.titulo);
              const legenda = replaceTokens(item.legenda);
              const src = resolveImage(item.imagem);
              return `
                <button
                  type="button"
                  class="gallery-item reveal"
                  data-gallery-index="${index}"
                  aria-label="Ampliar imagem: ${escapeHTML(titulo)}"
                >
                  <div class="gallery-thumb">
                    <img
                      src="${escapeHTML(src)}"
                      alt="${escapeHTML(titulo)}"
                      loading="lazy"
                      referrerpolicy="no-referrer"
                      onerror="this.style.display='none'; this.nextElementSibling.classList.add('is-visible');"
                    />
                    <div class="image-fallback" aria-hidden="true">
                      <span style="font-size: 0.875rem; font-weight: 500">${escapeHTML(titulo)}</span>
                    </div>
                    <span class="gallery-zoom-hint" aria-hidden="true">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 3 21 3 21 9" />
                        <polyline points="9 21 3 21 3 15" />
                        <line x1="21" y1="3" x2="14" y2="10" />
                        <line x1="3" y1="21" x2="10" y2="14" />
                      </svg>
                    </span>
                  </div>
                  <div class="gallery-caption">
                    <div class="gallery-caption-title">${escapeHTML(titulo)}</div>
                    ${legenda ? `<div class="gallery-caption-sub">${escapeHTML(legenda)}</div>` : ''}
                  </div>
                </button>
              `;
            })
            .join('');

          const lightbox = $('#gallery-lightbox');
          const lbImg = $('#lightbox-img');
          const lbTitle = $('#lightbox-title');
          const lbSubtitle = $('#lightbox-subtitle');
          const lbCounter = $('#lightbox-counter');
          const lbClose = $('#lightbox-close');
          const lbPrev = $('#lightbox-prev');
          const lbNext = $('#lightbox-next');
          let currentIndex = 0;

          const updateLightbox = (idx) => {
            currentIndex = (idx + galeria.length) % galeria.length;
            const item = galeria[currentIndex];
            const titulo = replaceTokens(item.titulo);
            lbImg.src = resolveImage(item.imagem);
            lbImg.alt = titulo;
            lbTitle.textContent = titulo;
            lbSubtitle.textContent = replaceTokens(item.legenda || '');
            lbCounter.textContent = `${currentIndex + 1} / ${galeria.length}`;
          };

          const openLightbox = (idx) => {
            updateLightbox(idx);
            lightbox.classList.add('is-open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            lbClose.focus();
          };

          const closeLightbox = () => {
            lightbox.classList.remove('is-open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
          };

          galleryGrid.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-gallery-index]');
            if (!btn) return;
            openLightbox(Number(btn.getAttribute('data-gallery-index')));
          });

          lbClose.addEventListener('click', closeLightbox);
          lbPrev.addEventListener('click', () => updateLightbox(currentIndex - 1));
          lbNext.addEventListener('click', () => updateLightbox(currentIndex + 1));
          lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) closeLightbox();
          });

          document.addEventListener('keydown', (event) => {
            if (!lightbox.classList.contains('is-open')) return;
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') updateLightbox(currentIndex - 1);
            if (event.key === 'ArrowRight') updateLightbox(currentIndex + 1);
          });
        }

        // 9. Sobre
        const aboutImg = $('#about-image');
        aboutImg.src = resolveImage(CONFIG.imagens.sobre);
        aboutImg.alt = CONFIG.imagens.sobreAlt;
        aboutImg.addEventListener('error', () => {
          aboutImg.style.display = 'none';
          $('#about-image-fallback').classList.add('is-visible');
        });
        $('#about-fallback-profession').textContent = PRESET.profissao;
        $('#about-fallback-name').textContent = nomeAtivo;
        $('#about-kicker').textContent = R.secoes.sobre.sobretitulo;
        $('#about-title').textContent = replaceTokens(PRESET.sobre.titulo);
        $('#about-prose').innerHTML = (PRESET.sobre.paragrafos || [])
          .map((p) => `<p>${escapeHTML(replaceTokens(p))}</p>`)
          .join('');
        $('#about-differentials').innerHTML = (PRESET.sobre.diferenciais || [])
          .map(
            (dif) => `
            <div>
              <h3 class="differential-item-title">${escapeHTML(replaceTokens(dif.titulo))}</h3>
              <p class="differential-item-text">${escapeHTML(replaceTokens(dif.texto))}</p>
            </div>
          `
          )
          .join('');

        // 10. Como Funciona o Atendimento
        const etapas = Array.isArray(PRESET.etapas) ? PRESET.etapas : [];
        if (etapas.length === 0) {
          $('#atendimento').style.display = 'none';
          $$('a[href="#atendimento"]').forEach((link) => {
            link.style.display = 'none';
          });
        } else {
          $('#steps-kicker').textContent = R.secoes.atendimento.sobretitulo;
          $('#steps-title').textContent = R.secoes.atendimento.titulo;
          $('#steps-subtitle').textContent = R.secoes.atendimento.subtitulo;
          $('#steps-grid').innerHTML = etapas
            .map(
              (step) => `
              <article class="step-card reveal">
                <span class="step-num tabular">${escapeHTML(step.numero)}</span>
                <h3 class="step-title">${escapeHTML(replaceTokens(step.titulo))}</h3>
                <p class="step-desc">${escapeHTML(replaceTokens(step.descricao))}</p>
              </article>
            `
            )
            .join('');
        }

        // 11. Depoimentos
        const depoimentos = Array.isArray(PRESET.depoimentos) ? PRESET.depoimentos : [];
        if (depoimentos.length === 0) {
          $('#depoimentos').style.display = 'none';
          $$('a[href="#depoimentos"]').forEach((link) => {
            link.style.display = 'none';
          });
        } else {
          $('#testimonials-kicker').textContent = R.secoes.depoimentos.sobretitulo;
          $('#testimonials-title').textContent = R.secoes.depoimentos.titulo;
          $('#testimonials-subtitle').textContent = R.secoes.depoimentos.subtitulo;
          $('#testimonials-grid').innerHTML = depoimentos
            .map(
              (dep) => `
              <article class="testimonial-card reveal">
                <blockquote class="testimonial-quote">“${escapeHTML(replaceTokens(dep.texto))}”</blockquote>
                <footer class="testimonial-author">
                  <div class="testimonial-name">${escapeHTML(replaceTokens(dep.autor))}</div>
                  <div class="testimonial-meta">${escapeHTML(replaceTokens(dep.contexto))}</div>
                </footer>
              </article>
            `
            )
            .join('');
        }

        // 12. Onde Estou e Horários + Avaliação em Estrelas
        const loc = PRESET.localizacao;
        if (!loc) {
          $('#localizacao').style.display = 'none';
          $$('a[href="#localizacao"]').forEach((link) => {
            link.style.display = 'none';
          });
        } else {
          $('#location-kicker').textContent = R.secoes.localizacao.sobretitulo;
          $('#location-title').textContent = R.secoes.localizacao.titulo;
          $('#location-subtitle').textContent = R.secoes.localizacao.subtitulo;
          $('#location-address-label').textContent = R.secoes.localizacao.labelEndereco;
          $('#location-hours-label').textContent = R.secoes.localizacao.labelHorarios;

          const enderecoTexto = replaceTokens(loc.endereco);
          $('#location-address').textContent = enderecoTexto;
          $('#location-reference').textContent = replaceTokens(loc.referencia || '');

          $('#location-hours').innerHTML = (loc.horarios || [])
            .map(
              (h) => `
              <li class="hours-row">
                <span class="hours-day">${escapeHTML(h.dia)}</span>
                <span class="hours-time tabular">${escapeHTML(h.hora)}</span>
              </li>
            `
            )
            .join('');

          const mapsQuery = encodeURIComponent(enderecoTexto);
          $('#location-maps-btn').href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
          $('#location-maps-label').textContent = R.botoes.comoChegar;

          if (loc.avaliacao) {
            $('#rating-label').textContent = R.secoes.localizacao.labelAvaliacoes;
            $('#rating-score').textContent = loc.avaliacao.nota;
            $('#rating-count').textContent = loc.avaliacao.total;
            $('#rating-summary').textContent = replaceTokens(loc.avaliacao.resumo);

            const totalStars = Math.max(1, Math.min(5, Number(loc.avaliacao.estrelas || 5)));
            const starSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            $('#rating-stars').innerHTML = starSvg.repeat(totalStars);
          } else {
            $('#rating-card').style.display = 'none';
          }
        }

        // 13. Perguntas Frequentes
        const faqItems = Array.isArray(PRESET.faq) ? PRESET.faq : [];
        if (faqItems.length === 0) {
          $('#duvidas').style.display = 'none';
          $$('a[href="#duvidas"]').forEach((link) => {
            link.style.display = 'none';
          });
        } else {
          $('#faq-kicker').textContent = R.secoes.faq.sobretitulo;
          $('#faq-title').textContent = R.secoes.faq.titulo;
          $('#faq-subtitle').textContent = R.secoes.faq.subtitulo;
          const faqList = $('#faq-list');
          faqList.innerHTML = faqItems
            .map(
              (item, idx) => `
              <div class="faq-item">
                <button
                  type="button"
                  class="faq-trigger"
                  aria-expanded="${idx === 0 ? 'true' : 'false'}"
                  aria-controls="faq-panel-${idx}"
                  id="faq-btn-${idx}"
                >
                  <span>${escapeHTML(replaceTokens(item.pergunta))}</span>
                  <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                </button>
                <div
                  class="faq-panel ${idx === 0 ? 'is-open' : ''}"
                  id="faq-panel-${idx}"
                  role="region"
                  aria-labelledby="faq-btn-${idx}"
                >
                  <div class="faq-panel-inner">
                    <p class="faq-answer">${escapeHTML(replaceTokens(item.resposta))}</p>
                  </div>
                </div>
              </div>
            `
            )
            .join('');

          faqList.addEventListener('click', (event) => {
            const trigger = event.target.closest('.faq-trigger');
            if (!trigger) return;
            const isExpanded = trigger.getAttribute('aria-expanded') === 'true';
            const panelId = trigger.getAttribute('aria-controls');
            const panel = document.getElementById(panelId);

            faqList.querySelectorAll('.faq-trigger').forEach((btn) => {
              btn.setAttribute('aria-expanded', 'false');
            });
            faqList.querySelectorAll('.faq-panel').forEach((el) => {
              el.classList.remove('is-open');
            });

            if (!isExpanded && panel) {
              trigger.setAttribute('aria-expanded', 'true');
              panel.classList.add('is-open');
            }
          });
        }

        // 14. Contato Final & Formulário WhatsApp
        $('#contact-kicker').textContent = R.secoes.contato.sobretitulo;
        $('#contact-title').textContent = replaceTokens(PRESET.contatoFinal.titulo);
        $('#contact-subtitle').textContent = replaceTokens(PRESET.contatoFinal.subtitulo);
        $('#contact-label-whatsapp').textContent = R.secoes.contato.labelWhatsapp;
        $('#contact-label-email').textContent = R.secoes.contato.labelEmail;
        $('#contact-label-registro').textContent = R.secoes.contato.labelRegistro;

        const contactWaLink = $('#contact-whatsapp-link');
        contactWaLink.textContent = whatsappExibicaoAtivo;
        contactWaLink.href = defaultWaUrl;

        const contactEmailLink = $('#contact-email-link');
        contactEmailLink.textContent = emailAtivo;
        contactEmailLink.href = `mailto:${emailAtivo}`;

        if (PRESET.registroProfissional) {
          $('#contact-registro').textContent = replaceTokens(PRESET.registroProfissional);
        } else {
          $('#contact-registro-wrap').style.display = 'none';
        }

        const F = R.secoes.formulario;
        $('#form-label-name').textContent = F.labelNome;
        $('#lead-name').placeholder = F.placeholderNome;
        $('#form-label-phone').textContent = F.labelTelefone;
        $('#lead-phone').placeholder = F.placeholderTelefone;
        $('#form-label-intent').textContent = F.labelObjetivo;
        $('#form-label-extra').textContent = F.labelComplemento;
        $('#lead-extra').placeholder = F.placeholderComplemento;
        $('#form-label-message').textContent = F.labelMensagem;
        $('#lead-message').placeholder = F.placeholderMensagem;
        $('#form-submit-btn').textContent = R.botoes.enviarFormulario;
        $('#form-confirm-kicker').textContent = F.confirmacaoSobretitulo;
        $('#form-confirm-title').textContent = F.confirmacaoTitulo;
        $('#form-confirm-subtitle').textContent = F.confirmacaoSubtitulo;
        $('#form-whatsapp-launch').textContent = R.botoes.abrirWhatsappFormulario;
        $('#form-reset-btn').textContent = R.botoes.editarFormulario;

        const intentSelect = $('#lead-intent');
        const opcoesSelect = [
          ...servicos.map((s) => replaceTokens(s.nome)),
          'Agendar atendimento inicial',
          'Outras informações'
        ];
        intentSelect.innerHTML = opcoesSelect
          .map((opt) => `<option value="${escapeHTML(opt)}">${escapeHTML(opt)}</option>`)
          .join('');

        const form = $('#whatsapp-form');
        const errorBox = $('#form-error');
        const errorText = $('#form-error-text');
        const confirmationBox = $('#form-confirmation');
        const previewText = $('#form-preview-text');
        const launchBtn = $('#form-whatsapp-launch');
        const resetBtn = $('#form-reset-btn');

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          errorBox.classList.remove('is-error');

          const nome = $('#lead-name').value.trim();
          const telefone = $('#lead-phone').value.trim();
          const assunto = $('#lead-intent').value;
          const extra = $('#lead-extra').value.trim();
          const mensagem = $('#lead-message').value.trim();

          if (nome.length < 2) {
            errorText.textContent = 'Por favor, informe seu nome para personalizar o atendimento.';
            errorBox.classList.add('is-error');
            $('#lead-name').focus();
            return;
          }

          const digits = telefone.replace(/\D/g, '');
          if (digits.length < 10) {
            errorText.textContent = 'Informe um número de WhatsApp válido com DDD.';
            errorBox.classList.add('is-error');
            $('#lead-phone').focus();
            return;
          }

          const lines = [
            `Olá, ${nomeAtivo}! Meu nome é ${nome}.`,
            `Assunto: ${assunto}.`
          ];
          if (extra) lines.push(`${F.labelComplemento}: ${extra}.`);
          if (mensagem) lines.push(`Mensagem: ${mensagem}`);
          lines.push(`Meu WhatsApp para retorno: ${telefone}.`);

          const compiledMessage = lines.join('\n');
          previewText.textContent = compiledMessage;
          launchBtn.href = buildWhatsAppUrl(compiledMessage);

          form.style.display = 'none';
          confirmationBox.classList.add('is-visible');
        });

        resetBtn.addEventListener('click', () => {
          confirmationBox.classList.remove('is-visible');
          form.style.display = 'block';
        });

        // 15. Rodapé
        const currentYear = new Date().getFullYear();
        $('#footer-brand').textContent = `${nomeAtivo} · ${PRESET.profissao}`;
        const footerReg = $('#footer-registro');
        if (PRESET.registroProfissional) {
          footerReg.textContent = replaceTokens(PRESET.registroProfissional);
        } else {
          footerReg.style.display = 'none';
        }
        $('#footer-city').textContent = cidadeAtiva;

        const igLink = $('#footer-instagram');
        igLink.textContent = `Instagram (${instaHandle})`;
        igLink.href = instagramUrlAtivo;

        const footerEmail = $('#footer-email');
        footerEmail.textContent = emailAtivo;
        footerEmail.href = `mailto:${emailAtivo}`;

        $('#footer-rights').textContent = `© ${currentYear} ${nomeAtivo}. Todos os direitos reservados.`;
        $('#footer-disclaimer').textContent = R.secoes.rodape.disclaimer;

        // 16. Header Fixo e Menu Mobile
        const header = $('#site-header');
        const handleScrollHeader = () => {
          if (window.scrollY > 24) {
            header.classList.add('is-scrolled');
          } else {
            header.classList.remove('is-scrolled');
          }
        };
        window.addEventListener('scroll', handleScrollHeader, { passive: true });
        handleScrollHeader();

        const menuToggle = $('#menu-toggle');
        const mobileNav = $('#mobile-nav');
        const setMobileMenu = (open) => {
          menuToggle.setAttribute('aria-expanded', String(open));
          mobileNav.setAttribute('aria-hidden', String(!open));
          mobileNav.classList.toggle('is-open', open);
          document.body.style.overflow = open ? 'hidden' : '';
        };

        menuToggle.addEventListener('click', () => {
          const isOpen = mobileNav.classList.contains('is-open');
          setMobileMenu(!isOpen);
        });

        mobileNav.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => setMobileMenu(false));
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && mobileNav.classList.contains('is-open')) {
            setMobileMenu(false);
            menuToggle.focus();
          }
        });

        window.addEventListener('resize', () => {
          if (window.innerWidth >= 980 && mobileNav.classList.contains('is-open')) {
            setMobileMenu(false);
          }
        });

        // 17. Contagem Animada & Reveal Discreto
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const metricEls = document.querySelectorAll('.metric-value[data-target]');
        let metricsAnimated = false;

        const runMetricCounters = () => {
          if (metricsAnimated) return;
          metricsAnimated = true;

          metricEls.forEach((el) => {
            const target = Number(el.getAttribute('data-target') || 0);
            const suffix = el.getAttribute('data-suffix') || '';

            if (prefersReducedMotion) {
              el.textContent = `${target}${suffix}`;
              return;
            }

            const duration = 1100;
            const startTime = performance.now();

            const step = (now) => {
              const progress = Math.min((now - startTime) / duration, 1);
              const eased = 1 - Math.pow(1 - progress, 3);
              const current = Math.round(target * eased);
              el.textContent = `${current}${suffix}`;
              if (progress < 1) {
                requestAnimationFrame(step);
              }
            };
            requestAnimationFrame(step);
          });
        };

        if ('IntersectionObserver' in window) {
          if (credibilidade.length > 0) {
            const metricsObserver = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    runMetricCounters();
                    metricsObserver.disconnect();
                  }
                });
              },
              { threshold: 0.3 }
            );
            metricsObserver.observe(metricsGrid);
          }

          const revealEls = document.querySelectorAll('.reveal');
          if (prefersReducedMotion) {
            revealEls.forEach((el) => el.classList.add('is-visible'));
          } else {
            const revealObserver = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    revealObserver.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
            );
            revealEls.forEach((el) => revealObserver.observe(el));
          }
        } else {
          runMetricCounters();
          document.querySelectorAll('.reveal').forEach((el) => el.classList.add('is-visible'));
        }
      })();
    </script>
  </body>
</html>
